<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background Dark Rounded Square -->
  <rect width="64" height="64" rx="16" fill="#02050e" />
  
  <!-- Outer Subtle Cyan Border -->
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- YP Monogram Text with Cyan Gradient -->
  <defs>
    <linearGradient id="ypGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- YP Monogram Typography -->
  <text 
    x="50%" 
    y="56%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="27" 
    letter-spacing="-1.5"
    fill="url(#ypGrad)"
    filter="url(#glow)"
  >
    YP
  </text>
</svg>
